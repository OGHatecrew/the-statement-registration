<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Statement — Community Registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#cbae74;
    --gold-bright:#e8cf9c;
    --line:rgba(203,174,116,0.35);
    --line-soft:rgba(255,255,255,0.1);
    --text:#f0ece2;
    --text-dim:#a39c8c;
    --danger:#d98b7e;
    --ok:#9fc19a;
  }
  *{ box-sizing:border-box; cursor:none; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:'Michroma', system-ui, sans-serif;
    color:var(--text);
    background:#000 url('wallpaper.png') no-repeat center center fixed;
    background-size:cover;
    min-height:100vh;
    font-weight:300;
    font-size:12px;
    line-height:1.65;
  }
  a{ color:var(--gold); }
  p{ font-size:12px; margin:0 0 14px; }

  .wrap{ max-width:520px; margin:0 auto; padding:64px 24px 80px; }

  .header{ text-align:center; margin-bottom:36px; }
  .logo-emblem{ width:96px; height:auto; margin:0 auto 18px; display:block; }
  .logo-text{ width:280px; height:auto; margin:0 auto 20px; display:block; }
  .meta-line{ font-size:11px; color:var(--text-dim); font-weight:300; }
  .meta-line + .meta-line{ margin-top:10px; }
  .meta-line b{ color:var(--gold-bright); font-weight:500; }
  .meta-line .soon{
    display:inline-block; border:1px solid var(--line); border-radius:100px; padding:3px 12px;
    font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold-bright);
  }

  .counters{ display:flex; gap:16px; margin-bottom:40px; perspective:900px; }
  @media (max-width:480px){ .counters{ flex-direction:column; } }
  .counter-card{
    position:relative; flex:1; overflow:hidden; border-radius:12px;
    padding:22px 24px;
    background:
      radial-gradient(circle at var(--mx,50%) var(--my,15%), rgba(255,255,255,0.10), transparent 55%),
      linear-gradient(155deg, rgba(255,255,255,0.05) 0%, rgba(20,17,10,0.55) 35%, rgba(0,0,0,0.75) 100%);
    border:1px solid var(--line);
    box-shadow:
      0 36px 60px -28px rgba(0,0,0,0.95),
      inset 0 1px 0 rgba(255,255,255,0.14),
      inset 0 -14px 24px -18px rgba(0,0,0,0.7),
      inset 1px 0 0 rgba(255,255,255,0.05),
      inset -1px 0 0 rgba(0,0,0,0.3);
    transform:perspective(900px) rotateX(0) rotateY(0);
    transition:transform .15s ease-out, border-color .2s ease, box-shadow .2s ease;
    will-change:transform;
  }
  .counter-card::after{
    content:''; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.10) 48%, transparent 62%);
    background-size:220% 220%;
    background-position:var(--shine-x,120%) var(--shine-y,0%);
    opacity:0; transition:opacity .25s ease;
  }
  .counter-card:hover{ border-color:var(--gold); box-shadow:0 40px 70px -26px rgba(0,0,0,1), inset 0 1px 0 rgba(255,255,255,0.2), inset 0 -14px 24px -18px rgba(0,0,0,0.7); }
  .counter-card:hover::after{ opacity:1; }
  .counter-card .label{ font-size:11px; color:var(--text-dim); margin-bottom:10px; position:relative; }
  .counter-card .value{ color:var(--gold-bright); font-weight:500; font-size:26px; font-variant-numeric:tabular-nums; position:relative; text-shadow:0 1px 0 rgba(0,0,0,0.6); }

  .paths{ display:flex; flex-direction:column; gap:14px; perspective:900px; }
  .path-opt{
    background:rgba(0,0,0,0.35); border:1px solid var(--line-soft); border-radius:8px;
    padding:20px 22px; cursor:none; transition:transform .2s ease, border-color .2s ease;
    transform-style:preserve-3d;
  }
  .path-opt:hover{ border-color:var(--line); transform:translateZ(6px) scale(1.01); }
  .path-opt h3{ font-size:12px; font-weight:500; margin:0 0 4px; }
  .path-opt p{ font-size:11px; color:var(--text-dim); margin:0; font-weight:300; }

  .back{ background:none; border:none; color:var(--text-dim); font-family:'Michroma'; font-size:12px; padding:0; margin-bottom:24px; }
  .back:hover{ color:var(--gold); }

  fieldset{ border:none; padding:0; margin:0 0 18px; }
  label{ display:block; font-size:12px; color:var(--text-dim); margin-bottom:16px; }
  input{
    display:block; width:100%; margin-top:6px; background:rgba(0,0,0,0.4);
    border:1px solid var(--line-soft); border-radius:5px; padding:11px 13px;
    color:var(--text); font-family:'Michroma'; font-size:12px; outline:none;
  }
  input:focus{ border-color:var(--gold); }

  button.btn{
    background:transparent; border:1px solid var(--gold); color:var(--gold-bright);
    font-family:'Michroma'; font-size:10.5px; font-weight:500; padding:11px 22px; border-radius:5px;
    margin-right:8px; margin-top:4px; transition:background .15s ease;
  }
  button.btn:hover{ background:rgba(203,174,116,0.12); }
  button.btn.ghost{ border-color:var(--line-soft); color:var(--text-dim); }
  button.btn.ghost:hover{ border-color:var(--line); color:var(--text); }
  button.btn:disabled{ opacity:0.35; }

  .status{ font-size:11.5px; color:var(--text-dim); margin-bottom:22px; }
  .status b{ color:var(--gold-bright); font-weight:500; }
  .status.approved b{ color:var(--ok); }
  .status.rejected b{ color:var(--danger); }

  .note{ font-size:11.5px; color:var(--text-dim); opacity:0.75; margin-top:18px; }
  .msg-error{ font-size:11.5px; color:var(--danger); margin:10px 0; }
  .msg-ok{ font-size:11.5px; color:var(--ok); margin:10px 0; }

  .winner-row{ display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .winner-row span{ font-size:11px; color:var(--text-dim); width:16px; flex-shrink:0; }
  .winner-row input{ margin-top:0; }
  .winner-row button{ flex-shrink:0; }

  /* music toggle */
  #musicToggle{
    position:fixed; bottom:22px; right:22px; z-index:150;
    width:44px; height:44px; border-radius:50%;
    background:rgba(0,0,0,0.55); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    color:var(--gold-bright); font-size:16px; cursor:none;
    backdrop-filter:blur(4px);
  }
  #musicToggle:hover{ border-color:var(--gold); }

  /* wallet picker */
  #walletPicker{
    position:fixed; inset:0; z-index:200; display:none; align-items:center; justify-content:center;
  }
  .wallet-picker-backdrop{ position:absolute; inset:0; background:rgba(0,0,0,0.7); }
  .wallet-picker-box{
    position:relative; background:#0a0a0a; border:1px solid var(--line); border-radius:10px;
    padding:24px; width:280px; max-width:90vw;
  }
  .wallet-picker-box h3{ font-size:12px; font-weight:500; margin:0 0 16px; text-align:center; }
  .wallet-option{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:rgba(255,255,255,0.03); border:1px solid var(--line-soft); border-radius:6px;
    padding:12px 14px; margin-bottom:8px; color:var(--text); font-family:'Michroma'; font-size:11px;
  }
  .wallet-option:hover{ border-color:var(--gold); }
  .wallet-option img{ width:20px; height:20px; border-radius:4px; flex-shrink:0; }

  /* custom 3D gold cursor */
  #goldCursor{
    position:fixed; top:0; left:0; width:16px; height:16px; pointer-events:none; z-index:9999;
    clip-path:polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
    background:linear-gradient(135deg, #fff3d6, #cbae74 45%, #7a6636 100%);
    box-shadow:0 2px 6px rgba(0,0,0,0.6), 0 0 8px rgba(203,174,116,0.5);
    transform:translate(-50%,-50%) rotate(0deg);
    will-change:transform;
  }
</style>
</head>
<body>

<div id="goldCursor"></div>

<audio id="bgMusic" loop preload="auto">
  <source src="background-music.mp4" type="audio/mp4">
</audio>
<button type="button" id="musicToggle" onclick="toggleMusic()" aria-label="Toggle background music">&#9835;</button>

<div id="walletPicker">
  <div class="wallet-picker-backdrop" onclick="closeWalletPicker()"></div>
  <div class="wallet-picker-box">
    <h3>Choose a wallet</h3>
    <div id="walletList"></div>
    <button class="back" onclick="closeWalletPicker()" style="display:block; margin:8px auto 0;">Cancel</button>
  </div>
</div>

<div class="wrap">
  <div class="header">
    <img src="logo-emblem.png" alt="" class="logo-emblem" />
    <img src="logo-text.png" alt="The Statement" class="logo-text" />
    <div class="meta-line">Supply <b>2,899</b> &nbsp;·&nbsp; Mint price <b>Free</b></div>
    <div class="meta-line"><span class="soon">Coming Soon</span></div>
  </div>

  <div class="counters">
    <div class="counter-card">
      <div class="label">Total Applications</div>
      <div class="value" id="holderCount">1,860</div>
    </div>
    <div class="counter-card">
      <div class="label">CM Applications</div>
      <div class="value" id="appCount">480</div>
    </div>
  </div>

  <div id="registerNowWrap" style="text-align:center;">
    <button class="btn" onclick="showPathChoice()">Register Now</button>
  </div>

  <div class="paths" id="pathChoice" style="display:none;">
    <div class="path-opt" onclick="choosePath('manager')">
      <h3>Community Managers</h3>
      <p>Apply on behalf of your community</p>
    </div>
    <div class="path-opt" onclick="choosePath('individual')">
      <h3>Individuals</h3>
      <p>Apply for whitelist</p>
    </div>
  </div>

  <div id="flowWrap" style="display:none;">
    <button class="back" onclick="backToPaths()">&larr; Back</button>
    <button class="back" id="disconnectBtn" onclick="disconnectWallet()" style="display:none; float:right;">Disconnect Wallet</button>
    <div id="statusLine" class="status"></div>
    <div id="appBody"></div>
  </div>
</div>

<script>
  // ---- custom gold cursor, eased follow with slight rotation ----
  const cursorEl = document.getElementById('goldCursor');
  let cx = window.innerWidth/2, cy = window.innerHeight/2, tx = cx, ty = cy, lastAngle = 0;
  document.addEventListener('mousemove', (e) => { tx = e.clientX; ty = e.clientY; });
  function cursorLoop(){
    const dx = tx - cx, dy = ty - cy;
    cx += dx * 0.25; cy += dy * 0.25;
    if(Math.abs(dx) + Math.abs(dy) > 1.5){
      lastAngle = Math.atan2(dy, dx) * (180/Math.PI) + 90;
    }
    cursorEl.style.transform = `translate(${cx}px, ${cy}px) translate(-50%,-50%) rotate(${lastAngle}deg)`;
    requestAnimationFrame(cursorLoop);
  }
  cursorLoop();
  document.addEventListener('mousedown', () => cursorEl.style.transform += ' scale(0.8)');

  // ---- 3D tilt + shine on the counter cards ----
  document.querySelectorAll('.counter-card').forEach(card => {
    card.addEventListener('mousemove', (e) => {
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width;
      const py = (e.clientY - r.top) / r.height;
      const rx = (0.5 - py) * 14;
      const ry = (px - 0.5) * 16;
      card.style.transform = `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg) translateZ(6px)`;
      card.style.setProperty('--mx', (px*100) + '%');
      card.style.setProperty('--my', (py*100) + '%');
      card.style.setProperty('--shine-x', (px*100) + '%');
      card.style.setProperty('--shine-y', (py*100) + '%');
    });
    card.addEventListener('mouseleave', () => {
      card.style.transform = 'perspective(900px) rotateX(0) rotateY(0)';
    });
  });

  // ---- background music: loops forever once started. Browsers block audio
  // with sound from autoplaying before the visitor interacts with the page,
  // so this tries to autoplay and, if blocked, starts on the first click
  // anywhere and keeps the floating toggle in sync either way.
  const bgMusic = document.getElementById('bgMusic');
  const musicToggle = document.getElementById('musicToggle');
  bgMusic.volume = 0.5;

  function updateMusicToggleIcon(){
    musicToggle.innerHTML = bgMusic.paused ? '&#9835;' : '&#10074;&#10074;';
  }

  function toggleMusic(){
    if(bgMusic.paused){ bgMusic.play().catch(()=>{}); } else { bgMusic.pause(); }
  }

  bgMusic.addEventListener('play', updateMusicToggleIcon);
  bgMusic.addEventListener('pause', updateMusicToggleIcon);
  updateMusicToggleIcon();

  bgMusic.play().catch(() => {
    const startOnFirstClick = () => {
      bgMusic.play().catch(()=>{});
      document.removeEventListener('click', startOnFirstClick);
    };
    document.addEventListener('click', startOnFirstClick);
  });

  const PINNED_POST_URL = 'https://x.com/thestatementonl/status/2099443959571574810';
  const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyjZsNrPrfTtShDAOBkruqvPa68pUASWQZnf98JahJLbTZYWC0YSx7ufpqF7dntAWsdSA/exec';

  // Talks to the Google Apps Script backend. Uses text/plain on purpose:
  // Apps Script doesn't answer CORS preflight requests, and sending JSON with
  // a real application/json content type triggers one from the browser.
  // Apps Script's own latency is unpredictable (cold starts, its redirect
  // through googleusercontent.com) and can occasionally take 10-20s+ even
  // when nothing is actually wrong, so one attempt at 15s was too eager to
  // give up. This gives it more time, and retries once automatically before
  // reporting a failure to the user.
  async function callBackend(action, payload){
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 12000);
    try{
      const res = await fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, ...(payload || {}) }),
        signal: controller.signal
      });
      return await res.json();
    }catch(err){
      return { error: err.name === 'AbortError' ? 'The server took too long to respond. Try again in a moment.' : 'Could not reach the server. Check your connection and try again.' };
    }finally{
      clearTimeout(timer);
    }
  }

  async function getIpAndLocation(){
    try{
      const res = await fetch('https://ipapi.co/json/');
      const data = await res.json();
      return { ip: data.ip || 'Unknown', location: [data.city, data.country_name].filter(Boolean).join(', ') || 'Unknown' };
    }catch(err){
      return { ip: 'Unknown', location: 'Unknown' };
    }
  }

  let path = null;
  let state = 'disconnected';
  let walletAddr = '';

  const flowWrap = document.getElementById('flowWrap');
  const pathChoice = document.getElementById('pathChoice');
  const appBody = document.getElementById('appBody');
  const statusLine = document.getElementById('statusLine');

  const holderCountEl = document.getElementById('holderCount');
  const appCountEl = document.getElementById('appCount');

  let counters = { holders: 0, apps: 0 };

  function renderCounters(){
    holderCountEl.textContent = counters.holders.toLocaleString();
    appCountEl.textContent = counters.apps.toLocaleString();
  }

  async function loadCounters(){
    const res = await callBackend('get_counts', {});
    if(res && typeof res.individuals === 'number'){
      counters.holders = res.individuals;
      counters.apps = res.managers;
      renderCounters();
    }
  }

  function shortAddr(a){ return a.slice(0,6) + '…' + a.slice(-4); }
  function setStatus(html, cls){ statusLine.innerHTML = html; statusLine.className = 'status' + (cls ? ' '+cls : ''); }

  function isXProfile(v){ return /^https?:\/\/(www\.)?(x|twitter)\.com\/[A-Za-z0-9_]{1,15}\/?$/.test(v.trim()); }
  function isXPost(v){ return /^https?:\/\/(www\.)?(x|twitter)\.com\/[A-Za-z0-9_]{1,15}\/status\/[0-9]+/.test(v.trim()); }
  function isWalletAddr(v){ return /^0x[a-fA-F0-9]{40}$/.test(v.trim()); }
  function isUrl(v){ try{ new URL(v.trim()); return true; }catch(e){ return false; } }

  // ---- Wallet discovery (EIP-6963): finds every installed wallet extension
  // (MetaMask, Rabby, Coinbase Wallet, etc.) so the person can pick which one
  // to use, instead of always defaulting to whichever one happens to be first.
  // Wallet extensions inject themselves at slightly different times, so this
  // re-asks every time the picker opens rather than relying on a one time
  // check at page load, which is what caused connections to sometimes miss
  // a wallet or hang.
  let discoveredWallets = [];
  let activeProvider = null;

  window.addEventListener('eip6963:announceProvider', (event) => {
    const detail = event.detail;
    if(detail && detail.info && !discoveredWallets.some(w => w.info.uuid === detail.info.uuid)){
      discoveredWallets.push(detail);
    }
  });
  window.dispatchEvent(new Event('eip6963:requestProvider'));

  function withTimeout(promise, ms){
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
    ]);
  }

  async function connectWallet(){
    // Ask again right now, and give extensions a brief moment to respond,
    // instead of trusting only whatever was found back at page load.
    window.dispatchEvent(new Event('eip6963:requestProvider'));
    await new Promise(resolve => setTimeout(resolve, 250));

    let wallets = discoveredWallets.slice();
    if(wallets.length === 0 && window.ethereum){
      wallets = [{ info:{ name:'Browser Wallet', icon:'' }, provider: window.ethereum }];
    }
    if(wallets.length === 0){
      alert('No wallet extension found. Please install MetaMask, Rabby, or another Web3 wallet, then reload the page.');
      return;
    }
    const list = document.getElementById('walletList');
    window._walletChoices = wallets;
    list.innerHTML = wallets.map((w, i) => `
      <button type="button" class="wallet-option" onclick="selectWallet(${i})">
        ${w.info.icon ? `<img src="${w.info.icon}" alt="" />` : ''}
        <span>${w.info.name}</span>
      </button>
    `).join('');
    document.getElementById('walletPicker').style.display = 'flex';
  }

  function closeWalletPicker(){
    document.getElementById('walletPicker').style.display = 'none';
  }

  async function selectWallet(i){
    const chosen = window._walletChoices[i];
    closeWalletPicker();

    let accounts;
    try{
      accounts = await withTimeout(chosen.provider.request({ method: 'eth_requestAccounts' }), 30000);
    }catch(err){
      alert(err && err.message === 'timeout'
        ? 'That wallet took too long to respond. Open its extension window directly, then try connecting again.'
        : 'Wallet connection was cancelled.');
      return;
    }

    activeProvider = chosen.provider;
    walletAddr = accounts[0];
    state = path === 'manager' ? 'mgr_check' : 'ind_check';
    appBody.innerHTML = '<p class="note">Checking your registration status…</p>';
    disconnectBtn.style.display = '';
    if(path === 'manager') await loadManagerStatus(); else await loadIndividualStatus();
    render();
  }

  async function disconnectWallet(){
    // Best effort: on wallets that support it (e.g. current MetaMask), this
    // actually revokes the site's access so the next connect asks fresh,
    // rather than silently reconnecting the same account. Time boxed so an
    // unsupported wallet can never make Disconnect hang.
    if(activeProvider && activeProvider.request){
      try{ await withTimeout(activeProvider.request({ method: 'wallet_revokePermissions', params: [{ eth_accounts: {} }] }), 2000); }catch(err){}
    }
    activeProvider = null;
    walletAddr = '';
    state = 'disconnected';
    if(mgrCountdownTimer){ clearInterval(mgrCountdownTimer); mgrCountdownTimer = null; }
    indProfile = null; indIsRegistered = false; indKnownStatus = null; indRetweetLink = '';
    mgrProfile = null; mgrIsRegistered = false; mgrReviewStatus = null; mgrType = null; mgrSpotsRequested = 0; mgrDeadline = null; winners = []; raffleResultsLink = '';
    disconnectBtn.style.display = 'none';
    render();
  }

  const registerNowWrap = document.getElementById('registerNowWrap');
  const disconnectBtn = document.getElementById('disconnectBtn');

  function showPathChoice(){
    registerNowWrap.style.display = 'none';
    pathChoice.style.display = '';
  }

  function backToPaths(){
    path = null; state = 'disconnected'; walletAddr = '';
    flowWrap.style.display = 'none';
    pathChoice.style.display = '';
    disconnectBtn.style.display = 'none';
  }

  function choosePath(p){
    path = p; state = 'disconnected';
    pathChoice.style.display = 'none';
    flowWrap.style.display = '';
    render();
  }

  function render(){
    if(!path) return;
    if(path === 'manager') return renderManager();
    return renderIndividual();
  }

  // ================= INDIVIDUAL FLOW =================
  let indProfile = null; // { username, xProfile }
  let indRetweetLink = '';
  let indIsRegistered = false;
  let indKnownStatus = null; // 'Under Review' | 'Approved' | 'Rejected'

  let indCheckFailed = false;

  async function loadIndividualStatus(){
    const res = await callBackend('get_individual_status', { wallet: walletAddr });
    indCheckFailed = false;
    if(res && res.status){
      indIsRegistered = true;
      indKnownStatus = res.status;
      indProfile = { username: res.username };
    }else if(res && res.error === 'Not registered'){
      indIsRegistered = false;
      indKnownStatus = null;
    }else{
      // Could not confirm either way (network hiccup, slow backend, etc).
      // Never fall through to the registration form here — that risks a
      // duplicate attempt for someone who is actually already registered.
      indCheckFailed = true;
    }
  }

  async function retryIndividualCheck(){
    appBody.innerHTML = '<p class="note">Checking your registration status…</p>';
    await loadIndividualStatus();
    render();
  }

  function changeIndividualWallet(){
    walletAddr = '';
    indProfile = null; indIsRegistered = false; indKnownStatus = null; indRetweetLink = ''; indCheckFailed = false;
    state = 'disconnected';
    render();
  }

  async function submitIndividualWallet(){
    const val = (document.getElementById('f_indWallet').value || '').trim();
    const slot = document.getElementById('indWalletMsgSlot');
    if(!isWalletAddr(val)){
      if(slot) slot.innerHTML = '<div class="msg-error">Enter a valid wallet address (starts with 0x).</div>';
      return;
    }
    walletAddr = val;
    state = 'ind_check';
    appBody.innerHTML = '<p class="note">Checking your registration status…</p>';
    await loadIndividualStatus();
    render();
  }

  function renderIndividual(){
    if(state === 'disconnected'){
      setStatus('');
      appBody.innerHTML = `
        <p>Paste your wallet address below. No wallet connection needed — enter it to register, or come back and enter it again anytime to check your status.</p>
        <fieldset>
          <label>Wallet address
            <input id="f_indWallet" placeholder="0x..." value="${walletAddr || ''}" />
          </label>
        </fieldset>
        <div id="indWalletMsgSlot"></div>
        <button class="btn" onclick="submitIndividualWallet()">Continue</button>
      `;
      return;
    }

    if(state === 'ind_check'){
      if(indCheckFailed){
        setStatus('Wallet: ' + shortAddr(walletAddr));
        appBody.innerHTML = `
          <p class="msg-error">Could not confirm your registration status. This is likely a slow connection to the server, not a lost registration.</p>
          <button class="btn" onclick="retryIndividualCheck()">Try again</button>
          <button class="btn ghost" onclick="changeIndividualWallet()">Use a different wallet address</button>
        `;
        return;
      }
      if(indIsRegistered && indProfile){
        const statusLabel = indKnownStatus;
        const clsMap = { 'Approved':'approved', 'Rejected':'rejected', 'Under Review':'' };
        const bodyMap = {
          'Approved': `<p>Your wallet has been registered for the GTD phase.</p>`,
          'Under Review': `<p>Your application is currently under review.</p><p>Please come back later to check your application status.</p>`,
          'Rejected': `<p>We're sorry, but your application has been rejected.</p><p>This may be due to incorrect, incomplete, or unverifiable information submitted during registration.</p>`
        };
        setStatus('Hi <b>' + indProfile.username + '</b> &middot; Status: <b>' + statusLabel + '</b>', clsMap[statusLabel] || '');
        appBody.innerHTML = (bodyMap[statusLabel] || '<p>Status unavailable.</p>') + `
          <button class="btn ghost" onclick="retryIndividualCheck()">Refresh status</button>
          <button class="btn ghost" onclick="changeIndividualWallet()">Use a different wallet address</button>
        `;
        return;
      }
      setStatus('Wallet: ' + shortAddr(walletAddr));
      appBody.innerHTML = `
        <fieldset>
          <label>X username
            <input id="f_username" placeholder="yourhandle" />
          </label>
          <label>X profile link
            <input id="f_indX" placeholder="https://x.com/yourhandle" />
          </label>
        </fieldset>
        <button class="btn" onclick="submitIndividualProfile()">Continue</button>
        <button class="btn ghost" onclick="changeIndividualWallet()">Use a different wallet address</button>
      `;
      return;
    }

    if(state === 'ind_task'){
      setStatus('Wallet: ' + shortAddr(walletAddr));
      appBody.innerHTML = `
        <p>Wallet registering: <b>${shortAddr(walletAddr)}</b></p>
        <p>Like and comment on our pinned post, then quote retweet it and paste the link below.</p>
        <button class="btn ghost" onclick="window.open('${PINNED_POST_URL}', '_blank')">Like the post</button>
        <button class="btn ghost" onclick="window.open('${PINNED_POST_URL}', '_blank')">Comment on the post</button>
        <fieldset style="margin-top:18px;">
          <label>Quote retweet link
            <input id="f_indRetweet" placeholder="https://x.com/yourhandle/status/..." value="${indRetweetLink}" />
          </label>
        </fieldset>
        <div id="verifyMsgSlot"></div>
        <button class="btn" id="indSubmitBtn" onclick="verifyIndividualTask()">Verify & Submit</button>
      `;
      return;
    }

    if(state === 'ind_done'){
      setStatus('Registered');
      appBody.innerHTML = `
        <p>You're registered, ${indProfile.username}. Come back anytime and paste your wallet address again to check your status.</p>
        <button class="btn ghost" onclick="changeIndividualWallet()">Check another wallet address</button>
      `;
      return;
    }
  }

  function submitIndividualProfile(){
    const username = document.getElementById('f_username').value.trim();
    const xProfile = document.getElementById('f_indX').value.trim();
    if(!username){ alert('Enter your X username.'); return; }
    if(!isXProfile(xProfile)){ alert('Enter a valid X profile link.'); return; }
    indProfile = { username, xProfile };
    state = 'ind_task';
    render();
  }

  async function verifyIndividualTask(){
    const link = document.getElementById('f_indRetweet').value.trim();
    if(!isXPost(link)){ alert('Enter a valid link to your quote retweet.'); return; }
    indRetweetLink = link;

    const btn = document.getElementById('indSubmitBtn');
    const slot = document.getElementById('verifyMsgSlot');
    if(btn) btn.disabled = true;
    if(slot) slot.innerHTML = `<p class="note">Submitting…</p>`;

    const { ip, location } = await getIpAndLocation();
    const res = await callBackend('register_individual', {
      wallet: walletAddr,
      username: indProfile.username,
      xProfile: indProfile.xProfile,
      retweetLink: indRetweetLink,
      ip, location
    });

    if(!res || res.error){
      if(btn) btn.disabled = false;
      if(slot) slot.innerHTML = `<div class="msg-error">${(res && res.error) || 'Something went wrong. Try again.'}</div>`;
      return;
    }

    state = 'ind_done';
    render();
  }

  // ================= MANAGER FLOW =================
  let mgrProfile = null; // { username, xProfile }
  let mgrType = null; // 'x' | 'discord'
  let mgrSpotsRequested = 0;
  let mgrReviewStatus = null; // 'Under Review' | 'Approved' | 'Rejected' | 'Expired'
  let winners = [];
  let raffleResultsLink = '';
  let mgrIsRegistered = false;
  let mgrDeadline = null; // ms epoch — when the 48h submission window closes
  let mgrCountdownTimer = null;

  function capFor(type){ return type === 'x' ? 10 : 20; }

  let mgrCheckFailed = false;

  async function loadManagerStatus(){
    const res = await callBackend('get_manager_status', { wallet: walletAddr });
    mgrCheckFailed = false;
    if(res && res.status){
      mgrIsRegistered = true;
      mgrProfile = { username: res.username };
      mgrReviewStatus = res.status;
      mgrType = res.applicationType;
      mgrSpotsRequested = res.spotsRequested;
      mgrDeadline = res.deadline || null;
      winners = Array.from({length: mgrSpotsRequested || 0}, () => ({wallet:'', x:''}));
    }else if(res && res.error === 'Not registered'){
      mgrIsRegistered = false;
      mgrReviewStatus = null;
    }else{
      mgrCheckFailed = true;
    }
  }

  function formatCountdown(ms){
    if(ms <= 0) return 'less than a minute';
    const totalMinutes = Math.floor(ms / 60000);
    const hours = Math.floor(totalMinutes / 60);
    const minutes = totalMinutes % 60;
    if(hours <= 0) return minutes + ' minute' + (minutes===1?'':'s');
    return hours + ' hour' + (hours===1?'':'s') + ' ' + minutes + ' minute' + (minutes===1?'':'s');
  }

  function startMgrCountdown(){
    if(mgrCountdownTimer) clearInterval(mgrCountdownTimer);
    const el = document.getElementById('mgrCountdown');
    if(!el || !mgrDeadline) return;
    const tick = () => {
      const remaining = mgrDeadline - Date.now();
      const target = document.getElementById('mgrCountdown');
      if(!target){ clearInterval(mgrCountdownTimer); return; }
      if(remaining <= 0){
        target.textContent = 'Your submission window has closed.';
        clearInterval(mgrCountdownTimer);
        // Re-check so the page flips to the Expired view instead of leaving a stale form up.
        retryManagerCheck();
        return;
      }
      target.textContent = 'Time left to submit: ' + formatCountdown(remaining);
    };
    tick();
    mgrCountdownTimer = setInterval(tick, 30000);
  }

  async function retryManagerCheck(){
    appBody.innerHTML = '<p class="note">Checking your application status…</p>';
    await loadManagerStatus();
    render();
  }

  function renderManager(){
    if(state === 'disconnected'){
      setStatus('Wallet not connected');
      appBody.innerHTML = `
        <p>Connect your wallet. A signature only, no gas, no permissions.</p>
        <button class="btn" onclick="connectWallet()">Connect Wallet</button>
      `;
      return;
    }

    if(state === 'mgr_check'){
      if(mgrCheckFailed){
        setStatus('Connected as ' + shortAddr(walletAddr));
        appBody.innerHTML = `
          <p class="msg-error">Could not confirm your application status. This is likely a slow connection to the server, not a lost application.</p>
          <button class="btn" onclick="retryManagerCheck()">Try again</button>
        `;
        return;
      }
      if(mgrIsRegistered && mgrProfile){
        state = 'mgr_review';
        return renderManager();
      }
      setStatus('Connected as ' + shortAddr(walletAddr));
      appBody.innerHTML = `
        <fieldset>
          <label>Username
            <input id="f_mgrUsername" placeholder="Your username" />
          </label>
          <label>X profile link
            <input id="f_mgrX" placeholder="https://x.com/yourhandle" />
          </label>
        </fieldset>
        <button class="btn" onclick="submitManagerProfile()">Continue</button>
      `;
      return;
    }

    if(state === 'mgr_type'){
      setStatus('Welcome, <b>' + mgrProfile.username + '</b>');
      appBody.innerHTML = `
        <p>How will you host your giveaway?</p>
        <button class="btn" onclick="startApplication('x')">Apply for X giveaway</button>
        <button class="btn" onclick="startApplication('discord')">Apply for Discord giveaway</button>
      `;
      return;
    }

    if(state === 'mgr_spots'){
      setStatus('Welcome, <b>' + mgrProfile.username + '</b> — ' + (mgrType === 'x' ? 'X' : 'Discord') + ' giveaway');
      appBody.innerHTML = `
        <p>Maximum ${capFor(mgrType)} spots for a ${mgrType === 'x' ? 'X' : 'Discord'} giveaway.</p>
        <fieldset>
          <label>Number of spots you want
            <input id="f_spots" type="number" min="1" max="${capFor(mgrType)}" placeholder="e.g. ${capFor(mgrType)}" />
          </label>
        </fieldset>
        <div id="spotsMsgSlot"></div>
        <button class="btn" onclick="submitSpotsRequest()">Submit Application</button>
      `;
      return;
    }

    if(state === 'mgr_review'){
      const clsMap = { 'Under Review':'', 'Approved':'approved', 'Rejected':'rejected', 'Expired':'rejected' };
      setStatus('Status: <b>' + mgrReviewStatus + '</b>', clsMap[mgrReviewStatus] || '');

      if(mgrReviewStatus === 'Under Review'){
        appBody.innerHTML = `
          <p>Your application is under manual review. Check back here for a decision.</p>
          <button class="btn ghost" onclick="retryManagerCheck()">Refresh status</button>
        `;
        return;
      }

      if(mgrReviewStatus === 'Rejected'){
        appBody.innerHTML = `<p>This application was not approved.</p>`;
        return;
      }

      if(mgrReviewStatus === 'Expired'){
        appBody.innerHTML = `<p>Your 48 hour window to submit your winner list has closed. If you believe this is a mistake, reach out to us directly.</p>`;
        return;
      }

      // Approved
      const cap = mgrSpotsRequested;
      appBody.innerHTML = `
        <p>Approved for ${cap} spot${cap===1?'':'s'}. Enter the link to where you hosted your giveaway, then each winner's wallet address and X username below.</p>
        <p class="note" id="mgrCountdown"><strong>You have 48 hours from approval to submit your winner list.</strong></p>
        <fieldset>
          <label>Link to your giveaway / raffle
            <input id="f_raffleLink" placeholder="https://..." value="${raffleResultsLink}" />
          </label>
        </fieldset>
        <div id="winnerRows"></div>
        <div id="winnersMsgSlot"></div>
        <button class="btn" onclick="submitWinners()">Submit Winner List</button>
      `;
      renderWinnerRows();
      if(mgrDeadline) startMgrCountdown();
      return;
    }

    if(state === 'mgr_done'){
      setStatus('Winners submitted', 'approved');
      appBody.innerHTML = `<p>Your community is registered. Winners submitted: ${winners.length} / ${mgrSpotsRequested}.</p>`;
      return;
    }
  }

  function submitManagerProfile(){
    const username = document.getElementById('f_mgrUsername').value.trim();
    const xProfile = document.getElementById('f_mgrX').value.trim();
    if(!username){ alert('Enter a username.'); return; }
    if(!isXProfile(xProfile)){ alert('Enter a valid X profile link.'); return; }
    mgrProfile = { username, xProfile };
    state = 'mgr_type';
    render();
  }

  function startApplication(type){
    mgrType = type;
    state = 'mgr_spots';
    render();
  }

  async function submitSpotsRequest(){
    const val = parseInt(document.getElementById('f_spots').value, 10);
    const cap = capFor(mgrType);
    if(!val || val < 1){ alert('Enter the number of spots you want.'); return; }
    if(val > cap){
      const slot = document.getElementById('spotsMsgSlot');
      slot.innerHTML = `<div class="msg-error">Max ${cap} allowed.</div>`;
      return;
    }

    const btn = document.querySelector('#appBody button.btn');
    if(btn) btn.disabled = true;
    const slot = document.getElementById('spotsMsgSlot');
    if(slot) slot.innerHTML = `<p class="note">Submitting…</p>`;

    const { ip, location } = await getIpAndLocation();
    const res = await callBackend('register_manager', {
      wallet: walletAddr,
      username: mgrProfile.username,
      xProfile: mgrProfile.xProfile,
      applicationType: mgrType,
      spotsRequested: val,
      ip, location
    });

    if(!res || res.error){
      if(btn) btn.disabled = false;
      if(slot) slot.innerHTML = `<div class="msg-error">${(res && res.error) || 'Something went wrong. Try again.'}</div>`;
      return;
    }

    mgrSpotsRequested = val;
    winners = Array.from({length: val}, () => ({wallet:'', x:''}));
    mgrReviewStatus = 'Under Review';
    state = 'mgr_review';
    render();
  }

  function renderWinnerRows(){
    const container = document.getElementById('winnerRows');
    if(!container) return;
    container.innerHTML = winners.map((w, i) => `
      <div class="winner-row">
        <span>${i+1}</span>
        <input placeholder="Winner wallet address" value="${w.wallet}" oninput="winners[${i}].wallet=this.value" />
        <input placeholder="Winner X username" value="${w.x}" oninput="winners[${i}].x=this.value" />
      </div>
    `).join('');
  }

  async function submitWinners(){
    const slot = document.getElementById('winnersMsgSlot');
    raffleResultsLink = document.getElementById('f_raffleLink').value.trim();
    if(!isUrl(raffleResultsLink)){
      slot.innerHTML = `<div class="msg-error">Enter a valid link to your giveaway.</div>`;
      return;
    }
    const filled = winners.filter(w => w.wallet.trim() && w.x.trim());
    if(filled.length !== winners.length){
      slot.innerHTML = `<div class="msg-error">Every winner needs both a wallet address and an X username.</div>`;
      return;
    }
    const allValid = filled.every(w => isWalletAddr(w.wallet));
    if(!allValid){
      slot.innerHTML = `<div class="msg-error">One or more wallet addresses look invalid. Correct and resubmit.</div>`;
      return;
    }

    slot.innerHTML = `<p class="note">Submitting…</p>`;
    const res = await callBackend('submit_winners', {
      wallet: walletAddr,
      raffleLink: raffleResultsLink,
      winners: filled.map(w => ({ wallet: w.wallet.trim(), xUsername: w.x.trim() }))
    });

    if(!res || res.error){
      slot.innerHTML = `<div class="msg-error">${(res && res.error) || 'Something went wrong. Try again.'}</div>`;
      return;
    }

    winners = filled;
    state = 'mgr_done';
    render();
  }

  renderCounters();
  loadCounters();
</script>

</body>
</html>
